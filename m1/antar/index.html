<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Antar Cafeteria - Choose an outlet</title>
<style>
  :root{
    --red:#e0392e;
    --ink:#1a1a1a;
    --gray:#6b6b6b;
    --light-gray:#9a9a9a;
    --pill-bg:#fbe3e0;
    --border:#eee;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);
    background:#fff;
  }
  img{max-width:100%;display:block;}

  /* ---------- Header ---------- */
  .site-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 24px;
    position:fixed;
    top:0;
    left:0;
    right:0;
    background:#fff;
    z-index:100;
    box-shadow:0 1px 6px rgba(0,0,0,.06);
  }
  .page-content{
    padding-top:66px;
  }
  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .brand-logo{
    height:34px;
    width:auto;
  }
  .account-icon{
    width:22px;
    height:22px;
    color:var(--red);
  }

  /* ---------- Hero banner ---------- */
  .hero{
    width:100%;
    height:420px;
    overflow:hidden;
    background:#e8ded0;
  }
  .hero img{
    width:100%;
    height:100%;
    object-fit:cover;
  }

  /* ---------- Section heading ---------- */
  .section-heading{
    max-width:1180px;
    margin:0 auto;
    padding:28px 24px 4px;
  }
  .section-heading h1{
    font-size:20px;
    font-weight:700;
    margin:0 0 2px;
  }
  .section-heading p{
    font-size:14px;
    color:var(--gray);
    margin:0;
  }

  /* ---------- Outlet grid ---------- */
  .outlet-grid{
    max-width:1180px;
    margin:0 auto;
    padding:16px 24px 60px;
    display:grid;
    grid-template-columns:repeat(3, 1fr);
    gap:22px;
  }

  .outlet-card{
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:0 2px 10px rgba(0,0,0,.05);
    padding:20px 20px 22px;
    display:flex;
    flex-direction:column;
  }

  .outlet-card .brand{
    margin-bottom:14px;
  }
  .outlet-card .brand-logo{
    height:26px;
  }

  .outlet-name{
    font-size:14px;
    font-weight:700;
    margin:0 0 6px;
    text-transform:none;
  }
  .outlet-address{
    font-size:12.5px;
    color:var(--gray);
    line-height:1.5;
    margin:0 0 18px;
    flex:1;
  }

  .view-menu-btn{
    display:block;
    width:100%;
    text-align:center;
    background:var(--pill-bg);
    color:var(--red);
    font-weight:700;
    font-size:14px;
    padding:13px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    transition:background .15s ease;
    text-decoration:none;
    box-sizing:border-box;
  }
  .view-menu-btn:hover{
    background:#f6cfc9;
  }

  /* ---------- Responsive ---------- */
  @media (max-width:900px){
    .outlet-grid{grid-template-columns:repeat(2, 1fr);}
    .hero{height:320px;}
  }

  @media (max-width:600px){
    .outlet-grid{grid-template-columns:1fr; gap:16px; padding:12px 16px 40px;}
    .site-header{padding:12px 16px;}
    .page-content{padding-top:58px;}
    .brand-name{font-size:24px;}
    .hero{height:220px;}
    .section-heading{padding:22px 16px 2px;}
  }
</style>
</head>
<body>

  <header class="site-header">
    <div class="brand">
      <img class="brand-logo" src="antar-logo.png" alt="Antar logo">
    </div>
    <svg class="account-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <circle cx="12" cy="8" r="4"/>
      <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
    </svg>
  </header>

  <div class="page-content">
  <section class="hero">
    <img src="antar-banner.jpg" alt="Antar Cafeteria food spread">
  </section>

  <div class="section-heading">
    <h1>Antar Cafeteria</h1>
    <p>Choose an outlet</p>
  </div>

  <div class="outlet-grid" id="outletGrid"></div>
  </div>

  <script>
    const outlets = [
      { name: "ANTAR Jumeriah", address: "Near Masjid, Al Wasl, Jumeriah, Dubai - united arab emirates", url: "https://nationalprintdubai.com/m1/antar/br1/" },
      { name: "ANTAR Al Warqa 4", address: "Adnoc Petrol Station Nouakchott St., Al Warqa 4, Dubai - United Arab Emirates", url: "https://nationalprintdubai.com/m1/antar/br3/" },
      { name: "ANTAR Al Quoz", address: "Next Bowling Center Al Quoz 1, Dubai", url: "https://nationalprintdubai.com/m1/antar/br4/" },
      { name: "ANTAR Nad Al Hamar", address: "Next to Emarat Petrol Station, Nad Al Hamar, Dubai", url: "https://nationalprintdubai.com/m1/antar/br5/" },
      { name: "ANTAR Jumeirah 5", address: "Jumeirah 5, Umm Suqeim, Opp New Choithrams, Al wasl Road", url: "https://nationalprintdubai.com/m1/antar/br6/" },
      { name: "ANTAR Al Mankhool", address: "Next to Public Library, Al Mankhool, Dubai", url: "https://nationalprintdubai.com/m1/antar/br7/" },
      { name: "ANTAR Sharjah", address: "ADNOC Station Al Madina, Al Jamaye'a 869, Maliha Road, Sharjah, U.A.E", url: "https://nationalprintdubai.com/m1/antar/br9/" },
      { name: "ANTAR Al Ain", address: "Adnoc Service Station 249, Ashareej - Al Ain- united arab emirates", url: "https://nationalprintdubai.com/m1/antar/br12/" },
      { name: "ANTAR AL WARQA 2", address: "ADNOC PETROL STATION, AL WARQA 2, DUBAI UAE", url: "https://nationalprintdubai.com/m1/antar/br13/" },

     
    ];

    const grid = document.getElementById('outletGrid');
    grid.innerHTML = outlets.map(o => `
      <div class="outlet-card">
        <div class="brand">
          <img class="brand-logo" src="antar-logo.png" alt="Antar logo">
        </div>
        <h3 class="outlet-name">${o.name}</h3>
        <p class="outlet-address">${o.address}</p>
        <a class="view-menu-btn" href="${o.url}" target="_blank" rel="noopener">View menu</a>
      </div>
    `).join('');
  </script>

</body>
</html>
